name: build

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile the app
        run: |
          swiftc -O -swift-version 5 -parse-as-library \
            -sdk "$(xcrun --show-sdk-path)" \
            -target "$(uname -m)-apple-macos14.0" \
            -o /tmp/Switchboard app/Sources/*.swift
      - name: Draw the app icon
        run: |
          app/make-icon.sh /tmp/AppIcon.icns
          file /tmp/AppIcon.icns
      - name: Check the shell scripts
        run: |
          bash -n bin/ccp
          bash -n app/Switchboard
          bash -n install.sh
          sh -n app/make-icon.sh
      - name: Smoke-test ccp
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          ./install.sh --no-app
          export PATH="$HOME/bin:$PATH"
          export CLAUDE_CONFIG_DIR="$HOME/.claude"; mkdir -p "$CLAUDE_CONFIG_DIR"
          echo '{"env":{"ANTHROPIC_BASE_URL":"https://gw.example.com","ANTHROPIC_MODEL":"demo-model"},"model":"opus"}' > "$CLAUDE_CONFIG_DIR/settings.json"
          ccp templates --plain
          ccp status --plain | grep -q '^state	foreign'
          ccp import corp
          ccp add demo -t anthropic-login --yes --use
          ccp list
          ccp show demo
          ccp status --plain | grep -q '^state	synced'
          grep -q '"model" : "opus"' "$CLAUDE_CONFIG_DIR/settings.json"
          ! grep -q ANTHROPIC_BASE_URL "$CLAUDE_CONFIG_DIR/settings.json"
          ccp use corp
          grep -q '"ANTHROPIC_MODEL" : "demo-model"' "$CLAUDE_CONFIG_DIR/settings.json"
          CCP_DRY_RUN=1 ccp demo | grep -q '"ANTHROPIC_BASE_URL" : ""'
          ccp use none
          ccp status --plain | grep -q '^state	unset'
          ccp doctor || true
